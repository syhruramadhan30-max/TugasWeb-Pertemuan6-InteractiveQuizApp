<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Interactive Quiz App</title>

<style>

/* ==============================
   RESET
============================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* ================================
   LIGHT MODE
================================ */

body.light {
    background:
        radial-gradient(
            circle at top left,
            #e9dff0,
            #f7f7fb 45%,
            #eef1f7
        );

    color: #17121c;
}


/* HEADER */

body.light .subtitle {
    color: #666b78;
}


/* THEME BUTTON */

body.light .theme {
    background: #ffffff;

    color: #17121c;

    border-color: #d7d9e0;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.08);
}


/* QUIZ CARD */

body.light .quiz-card,
body.light .result {
    background:
        rgba(255, 255, 255, 0.95);

    border-color: #dfe1e8;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.10);
}


/* LABEL */

body.light .label {
    color: #7b7180;
}


/* QUESTION */

body.light .question h2 {
    color: #17121c;
}


/* PROGRESS */

body.light .progress-bg {
    background: #dfe1e8;
}


/* TIMER */

body.light .timer {
    color: #666b78;
}

body.light .timer-number {
    background: #ffffff;

    color: #17121c;

    border: 1px solid #dfe1e8;
}


/* OPTIONS */

body.light .option {
    background: #f8f8fb;

    border-color: #dfe1e8;

    color: #17121c;
}


body.light .option:hover {
    background: #ffffff;

    border-color: #ff2188;

    box-shadow:
        0 5px 20px rgba(255, 33, 136, 0.10);
}


/* OPTION LETTER */

body.light .option-letter {
    background: #e7e8ee;

    color: #17121c;
}


/* CORRECT */

body.light .option.correct {
    background: rgba(32, 214, 138, 0.10);

    border-color: #20d68a;

    color: #14945e;
}


/* WRONG */

body.light .option.wrong {
    background: rgba(255, 77, 109, 0.10);

    border-color: #ff4d6d;

    color: #d92f4d;
}


/* FEEDBACK */

body.light .feedback.correct {
    color: #14945e;
}

body.light .feedback.wrong {
    color: #d92f4d;
}


/* RESULT */

body.light .result p {
    color: #666b78;
}


body.light .final-score {
    color: #ff2188;
}


body.light .info {
    background: #f7f7fa;

    border-color: #dfe1e8;

    color: #17121c;
}


body.light .info span {
    color: #6d7280;
}


/* FOOTER */

body.light footer {
    color: #737987;
}


/* ==============================
   MAIN CONTAINER
============================== */

.container {

    width: 90%;

    max-width: 1120px;

    margin: auto;

    padding-top: 55px;

    padding-bottom: 40px;
}


/* ==============================
   HEADER
============================== */

.header {

    display: flex;

    justify-content: space-between;

    align-items: flex-start;

    margin-bottom: 35px;
}


.small-title {

    color: #ff2188;

    font-size: 14px;

    font-weight: bold;

    letter-spacing: 4px;
}


.small-title::before {

    content: "";

    display: inline-block;

    width: 35px;

    height: 2px;

    background: #ff2188;

    margin-right: 12px;

    vertical-align: middle;
}


.header h1 {

    margin-top: 12px;

    font-size: 52px;

    line-height: 1.1;

    letter-spacing: -2px;
}


.header h1 span {

    color: #ff2188;
}


.subtitle {

    margin-top: 15px;

    color: #8c99b3;

    font-size: 18px;
}


/* ==============================
   THEME BUTTON
============================== */

.theme {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    border: 1px solid #2b3b56;

    background: #111d31;

    color: white;

    font-size: 25px;

    cursor: pointer;
}


/* ==============================
   QUIZ CARD
============================== */

.quiz-card {

    padding: 40px;

    border: 1px solid #293b59;

    border-radius: 22px;

    background:
        linear-gradient(
            145deg,
            #111d31,
            #0b1423
        );

    box-shadow:
        0 25px 70px rgba(0,0,0,.4);
}


/* ==============================
   TOP INFORMATION
============================== */

.quiz-top {

    display: flex;

    justify-content: space-between;
}


.label {

    color: #8290aa;

    font-size: 13px;

    font-weight: bold;

    letter-spacing: 2px;
}


.number {

    margin-top: 7px;

    font-size: 30px;

    font-weight: bold;
}


.score-box {

    text-align: right;
}


.score {

    margin-top: 5px;

    color: #ff2188;

    font-size: 34px;

    font-weight: bold;
}


/* ==============================
   PROGRESS
============================== */

.progress-bg {

    width: 100%;

    height: 8px;

    margin-top: 25px;

    border-radius: 20px;

    background: #1b293e;

    overflow: hidden;
}


.progress {

    width: 10%;

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #12d9ff,
            #ff2188
        );

    transition: width .3s;
}


/* ==============================
   TIMER
============================== */

.timer {

    display: flex;

    justify-content: flex-end;

    align-items: center;

    gap: 8px;

    margin-top: 30px;

    color: #9aa7bd;
}


.timer-number {

    min-width: 48px;

    padding: 8px 12px;

    border-radius: 9px;

    background: #1b2a45;

    color: white;

    text-align: center;

    font-weight: bold;
}


/* ==============================
   QUESTION
============================== */

.question {

    margin-top: 25px;

    margin-bottom: 25px;

    min-height: 70px;
}


.question h2 {

    color: #ffffff;

    font-size: 28px;

    line-height: 1.4;

    animation: appear .3s ease;
}


@keyframes appear {

    from {

        opacity: 0;

        transform: translateY(10px);
    }

    to {

        opacity: 1;

        transform: translateY(0);
    }
}


/* ==============================
   OPTIONS
============================== */

.options {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}


.option {

    display: flex;

    align-items: center;

    gap: 15px;

    min-height: 68px;

    padding: 15px;

    border: 1px solid #2b3d5c;

    border-radius: 13px;

    background: #111f35;

    color: #edf1f8;

    font-size: 16px;

    text-align: left;

    cursor: pointer;

    transition: .2s;
}


.option:hover {

    transform: translateY(-2px);

    border-color: #16caff;

    background: #172842;
}


.option-letter {

    width: 38px;

    height: 38px;

    min-width: 38px;

    display: flex;

    justify-content: center;

    align-items: center;

    border-radius: 50%;

    background: #253d66;

    font-weight: bold;
}


/* ==============================
   CORRECT
============================== */

.option.correct {

    border-color: #20e6b0;

    background: rgba(32,230,176,.12);

    color: #55f2c8;
}


/* ==============================
   WRONG
============================== */

.option.wrong {

    border-color: #ff526c;

    background: rgba(255,82,108,.12);

    color: #ff8999;
}


/* ==============================
   DISABLED
============================== */

.option.disabled {

    pointer-events: none;
}


/* ==============================
   FEEDBACK
============================== */

.feedback {

    min-height: 50px;

    margin-top: 18px;

    padding: 14px;

    border-radius: 10px;

    font-weight: bold;
}


.feedback:empty {

    padding: 0;

    margin-top: 5px;
}


.feedback.correct {

    color: #52f0c5;

    background: rgba(32,230,176,.08);

    border: 1px solid rgba(32,230,176,.4);
}


.feedback.wrong {

    color: #ff8293;

    background: rgba(255,82,108,.08);

    border: 1px solid rgba(255,82,108,.4);
}


/* ==============================
   NEXT BUTTON
============================== */

.next {

    width: 100%;

    margin-top: 10px;

    padding: 17px;

    border: none;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #ed147d,
            #ff2188
        );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


.next:disabled {

    opacity: .45;

    cursor: not-allowed;
}


/* ==============================
   RESULT
============================== */

.result {

    text-align: center;
}


.result-icon {

    font-size: 65px;

    margin-bottom: 15px;
}


.result h2 {

    font-size: 35px;
}


.result p {

    margin-top: 8px;

    color: #8c99b3;
}


.final-score {

    margin: 10px 0 25px;

    color: #ff2188;

    font-size: 70px;

    font-weight: bold;
}


.result-info {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 15px;
}


.info {

    padding: 20px;

    border: 1px solid #293b58;

    border-radius: 12px;

    background: #111f34;
}


.info span {

    display: block;

    margin-bottom: 8px;

    color: #8290aa;

    font-size: 13px;
}


.info strong {

    font-size: 24px;
}


.restart {

    width: 100%;

    margin-top: 20px;

    padding: 17px;

    border: none;

    border-radius: 12px;

    background: #ff2188;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;
}


/* ==============================
   HIDDEN
============================== */

.hidden {

    display: none !important;
}


/* ==============================
   FOOTER
============================== */

footer {

    padding: 20px;

    text-align: center;

    color: #5e6c83;

    font-size: 12px;
}


/* ==============================
   RESPONSIVE
============================== */

@media(max-width:700px) {

    .container {

        width: 94%;

        padding-top: 30px;
    }


    .header h1 {

        font-size: 36px;
    }


    .quiz-card {

        padding: 25px;
    }


    .options {

        grid-template-columns: 1fr;
    }


    .question h2 {

        font-size: 22px;
    }


    .result-info {

        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <div>

            <div class="small-title">
                QUIZ Informatika 
            </div>

            <h1>
                Interactive
                <span>Quiz App</span>
            </h1>

            <p class="subtitle">
                Uji pengetahuanmu dan raih high score terbaik!
            </p>

        </div>


        <button
            id="themeButton"
            class="theme"
            type="button"
        >
            🌙
        </button>

    </header>


    <!-- =========================
         QUIZ
    ========================== -->

    <main
        id="quizCard"
        class="quiz-card"
    >

        <div class="quiz-top">

            <div>

                <div class="label">
                    PERTANYAAN
                </div>

                <div
                    id="questionNumber"
                    class="number"
                >
                    1 / 10
                </div>

            </div>


            <div class="score-box">

                <div class="label">
                    SKOR
                </div>

                <div
                    id="score"
                    class="score"
                >
                    0
                </div>

            </div>

        </div>


        <!-- PROGRESS -->

        <div class="progress-bg">

            <div
                id="progress"
                class="progress"
            ></div>

        </div>


        <!-- TIMER -->

        <div class="timer">

            <span>
                ⏱️
            </span>

            <span>
                Waktu
            </span>

            <strong
                id="timer"
                class="timer-number"
            >
                15
            </strong>

        </div>


        <!-- QUESTION -->

        <div
            id="question"
            class="question"
        ></div>


        <!-- OPTIONS -->

        <div
            id="options"
            class="options"
        ></div>


        <!-- FEEDBACK -->

        <div
            id="feedback"
            class="feedback"
        ></div>


        <!-- NEXT -->

        <button
            id="next"
            class="next"
            type="button"
            disabled
        >
            Soal Berikutnya →
        </button>

    </main>


    <!-- =========================
         RESULT
    ========================== -->

    <main
        id="resultCard"
        class="quiz-card result hidden"
    >

        <div class="result-icon">
            🏆
        </div>

        <h2>
            Quiz Selesai!
        </h2>

        <p>
            Skor kamu
        </p>

        <div
            id="finalScore"
            class="final-score"
        >
            0
        </div>


        <div class="result-info">

            <div class="info">

                <span>
                    Jawaban Benar
                </span>

                <strong id="correctResult">
                    0 / 10
                </strong>

            </div>


            <div class="info">

                <span>
                    High Score
                </span>

                <strong id="highScore">
                    0
                </strong>

            </div>

        </div>


        <button
            id="restart"
            class="restart"
            type="button"
        >
            🔄 Main Lagi
        </button>

    </main>


</div>


<footer>
    Interactive Quiz App 
</footer>


<script>

/* =========================================
   DATA SOAL
========================================= */

const questions = [

    {
        question: "Apa kepanjangan dari HTML?",
        options: [
            "Hyper Text Markup Language",
            "High Text Machine Language",
            "Hyperlink Text Management Language",
            "Home Tool Markup Language"
        ],
        answer: 0
    },

    {
        question: "Bahasa yang digunakan untuk mengatur tampilan halaman web adalah?",
        options: [
            "HTML",
            "CSS",
            "Java",
            "SQL"
        ],
        answer: 1
    },

    {
        question: "Bahasa yang digunakan untuk membuat website menjadi interaktif adalah?",
        options: [
            "CSS",
            "HTML",
            "JavaScript",
            "XML"
        ],
        answer: 2
    },

    {
        question: "Apa fungsi localStorage pada browser?",
        options: [
            "Menyimpan data di browser",
            "Membuat server",
            "Menghapus browser",
            "Menghubungkan komputer"
        ],
        answer: 0
    },

    {
        question: "Method JavaScript untuk memilih elemen berdasarkan ID adalah?",
        options: [
            "getElementById()",
            "getClass()",
            "selectID()",
            "findElement()"
        ],
        answer: 0
    },

    {
        question: "Apa fungsi addEventListener()?",
        options: [
            "Membuat database",
            "Menambahkan event pada elemen",
            "Menghapus HTML",
            "Mengubah ukuran layar"
        ],
        answer: 1
    },

    {
        question: "Manakah yang termasuk struktur data JavaScript?",
        options: [
            "Array",
            "Monitor",
            "Browser",
            "Keyboard"
        ],
        answer: 0
    },

    {
        question: "Apa simbol komentar satu baris pada JavaScript?",
        options: [
            "<!-- -->",
            "/* */",
            "//",
            "#"
        ],
        answer: 2
    },

    {
        question: "Apa fungsi preventDefault()?",
        options: [
            "Menghentikan perilaku default browser",
            "Menghapus elemen",
            "Membuat animasi",
            "Menjalankan server"
        ],
        answer: 0
    },

    {
        question: "DOM merupakan singkatan dari?",
        options: [
            "Document Object Model",
            "Data Object Management",
            "Document Online Method",
            "Digital Object Machine"
        ],
        answer: 0
    }

];


/* =========================================
   VARIABLE
========================================= */

let current = 0;

let score = 0;

let correct = 0;

let answered = false;

let time = 15;

let timer;


/* =========================================
   ELEMENT
========================================= */

const questionNumber =
    document.getElementById("questionNumber");

const scoreElement =
    document.getElementById("score");

const progress =
    document.getElementById("progress");

const timerElement =
    document.getElementById("timer");

const questionElement =
    document.getElementById("question");

const optionsElement =
    document.getElementById("options");

const feedbackElement =
    document.getElementById("feedback");

const nextButton =
    document.getElementById("next");

const quizCard =
    document.getElementById("quizCard");

const resultCard =
    document.getElementById("resultCard");

const finalScore =
    document.getElementById("finalScore");

const correctResult =
    document.getElementById("correctResult");

const highScoreElement =
    document.getElementById("highScore");

const restartButton =
    document.getElementById("restart");

const themeButton =
    document.getElementById("themeButton");


/* =========================================
   HIGH SCORE
========================================= */

let highScore =
    Number(
        localStorage.getItem(
            "quizHighScore"
        )
    ) || 0;


/* =========================================
   TAMPILKAN SOAL
========================================= */

function loadQuestion() {

    clearInterval(timer);


    answered = false;


    nextButton.disabled = true;


    feedbackElement.textContent = "";

    feedbackElement.className =
        "feedback";


    const data =
        questions[current];


    /* =========================
       NOMOR SOAL
    ========================== */

    questionNumber.textContent =
        `${current + 1} / ${questions.length}`;


    /* =========================
       PROGRESS
    ========================== */

    progress.style.width =
        `${((current + 1) / questions.length) * 100}%`;


    /* =========================
       PERTANYAAN
    ========================== */

    questionElement.innerHTML = "";


    const title =
        document.createElement("h2");


    title.textContent =
        data.question;


    questionElement.appendChild(title);


    /* =========================
       PILIHAN
    ========================== */

    optionsElement.innerHTML = "";


    data.options.forEach(
        function(text, index) {

            const button =
                document.createElement("button");


            button.type =
                "button";


            button.className =
                "option";


            button.dataset.answer =
                index;


            const letter =
                document.createElement("span");


            letter.className =
                "option-letter";


            letter.textContent =
                String.fromCharCode(
                    65 + index
                );


            const answerText =
                document.createElement("span");


            answerText.textContent =
                text;


            button.appendChild(letter);

            button.appendChild(answerText);


            optionsElement.appendChild(
                button
            );

        }
    );


    startTimer();

}


/* =========================================
   PILIH JAWABAN
   EVENT DELEGATION
========================================= */

optionsElement.addEventListener(
    "click",
    function(event) {

        const button =
            event.target.closest(".option");


        if (!button) {
            return;
        }


        if (answered) {
            return;
        }


        answered = true;


        clearInterval(timer);


        const selected =
            Number(
                button.dataset.answer
            );


        const correctAnswer =
            questions[current].answer;


        const allOptions =
            document.querySelectorAll(
                ".option"
            );


        allOptions.forEach(
            function(item) {

                item.classList.add(
                    "disabled"
                );

            }
        );


        /* =====================
           BENAR
        ====================== */

        if (
            selected ===
            correctAnswer
        ) {

            button.classList.add(
                "correct"
            );


            score += 10;

            correct++;


            scoreElement.textContent =
                score;


            feedbackElement.textContent =
                "✓ Jawaban kamu benar!";


            feedbackElement.className =
                "feedback correct";

        }


        /* =====================
           SALAH
        ====================== */

        else {

            button.classList.add(
                "wrong"
            );


            allOptions[
                correctAnswer
            ].classList.add(
                "correct"
            );


            feedbackElement.textContent =
                "✗ Jawaban kamu salah. Jawaban yang benar ditandai hijau.";


            feedbackElement.className =
                "feedback wrong";

        }


        nextButton.disabled = false;


        if (
            current ===
            questions.length - 1
        ) {

            nextButton.textContent =
                "Lihat Hasil 🏆";

        }

    }
);


/* =========================================
   TIMER
========================================= */

function startTimer() {

    time = 15;


    timerElement.textContent =
        time;


    timer =
        setInterval(
            function() {

                time--;


                timerElement.textContent =
                    time;


                if (time <= 0) {

                    clearInterval(timer);

                    timeout();

                }

            },
            1000
        );

}


/* =========================================
   TIMEOUT
========================================= */

function timeout() {

    if (answered) {
        return;
    }


    answered = true;


    const correctAnswer =
        questions[current].answer;


    const allOptions =
        document.querySelectorAll(
            ".option"
        );


    allOptions.forEach(
        function(item, index) {

            item.classList.add(
                "disabled"
            );


            if (
                index ===
                correctAnswer
            ) {

                item.classList.add(
                    "correct"
                );

            }

        }
    );


    feedbackElement.textContent =
        "⏰ Waktu habis!";


    feedbackElement.className =
        "feedback wrong";


    nextButton.disabled = false;

}


/* =========================================
   NEXT BUTTON
========================================= */

nextButton.addEventListener(
    "click",
    function() {

        if (!answered) {
            return;
        }


        current++;


        if (
            current <
            questions.length
        ) {

            nextButton.textContent =
                "Soal Berikutnya →";


            loadQuestion();

        }

        else {

            showResult();

        }

    }
);


/* =========================================
   RESULT
========================================= */

function showResult() {

    clearInterval(timer);


    quizCard.classList.add(
        "hidden"
    );


    resultCard.classList.remove(
        "hidden"
    );


    finalScore.textContent =
        score;


    correctResult.textContent =
        `${correct} / ${questions.length}`;


    if (score > highScore) {

        highScore = score;


        localStorage.setItem(
            "quizHighScore",
            highScore
        );

    }


    highScoreElement.textContent =
        highScore;

}


/* =========================================
   RESTART
========================================= */

restartButton.addEventListener(
    "click",
    function() {

        current = 0;

        score = 0;

        correct = 0;


        scoreElement.textContent =
            "0";


        resultCard.classList.add(
            "hidden"
        );


        quizCard.classList.remove(
            "hidden"
        );


        nextButton.textContent =
            "Soal Berikutnya →";


        loadQuestion();

    }
);


/* ================================
   THEME
================================ */

themeButton.addEventListener(
    "click",
    function() {

        document.body.classList.toggle("light");

        const isLight =
            document.body.classList.contains("light");

        if (isLight) {

            themeButton.textContent = "☀️";

        } else {

            themeButton.textContent = "🌙";
